<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today, Me</title>
  <meta name="description" content="A place where your emotions are gently heard.">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Nanum Myeongjo', serif;
      background: linear-gradient(to bottom, #fff2e6, #ffe5d9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }
    .wrapper {
      width: 100%;
      padding: 1rem;
    }
    .card {
      background: #ffffffdd;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 520px;
      margin: auto;
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 14px 30px rgba(0,0,0,0.12);
    }
    .card h1 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
    }
    input[type="text"] {
      padding: 0.9rem;
      width: 100%;
      font-size: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      background-color: #fbbd9c;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
      background-color: #f99c74;
      transform: translateY(-2px);
    }
    .response {
      margin-top: 2rem;
      font-size: 1.2rem;
      color: #4a3f35;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .response.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>What happened today?</h1>
      <input type="text" id="userInput" placeholder="Write to yourself..." />
      <button onclick="getResponse()">Send</button>
      <div id="responseBox" class="response"></div>
    </div>
  </div>
  <script>
    const responses = [
      { text: "You're doing better than you think." },
      { text: "Even the quietest efforts echo in time." },
      { text: "It's okay to rest. You are not alone." },
      { text: "Progress is still progress, no matter how small." },
      { text: "Your story matters." },
      { text: "You made it through today. That is enough." },
      { text: "There’s beauty in the way you keep going." },
      { text: "One breath at a time. You're doing fine." }
    ];
    function getResponse() {
      const responseBox = document.getElementById('responseBox');
      const response = responses[Math.floor(Math.random() * responses.length)];
      responseBox.innerText = response.text;
      responseBox.classList.add("visible");
    }
  </script>
</body>
</html>
