<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Saved Messages | Today, Me</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Nanum Myeongjo', serif;
      background: #fffefb;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .log-box {
      max-width: 600px;
      margin: auto;
      text-align: left;
    }
    .entry {
      background: #fffaf0;
      border: 1px solid #f0e0d0;
      border-radius: 8px;
      margin: 1rem 0;
      padding: 1rem;
    }
    .entry small {
      display: block;
      margin-top: 0.5rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>My Saved Messages</h1>
  <div class="log-box" id="logBox"></div>
  <script>
    const log = JSON.parse(localStorage.getItem("emotionLog") || "[]");
    const container = document.getElementById("logBox");
    if (log.length === 0) {{
      container.innerHTML = "<p>No messages saved yet.</p>";
    }} else {{
      container.innerHTML = log.map(entry => `
        <div class="entry">
          ${entry.text}
          <small>${entry.emotion} • ${new Date(entry.time).toLocaleString()}</small>
        </div>
      `).join("");
    }}
  </script>
</body>
</html>
