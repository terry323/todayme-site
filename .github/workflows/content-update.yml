# GitHub Action: 문학 콘텐츠 자동 생성
name: Auto Generate Literature

on:
  schedule:
    - cron: '0 3,11,19 * * *'  # 하루 3번
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate literary content
        run: python generate_literature.py

      - name: Commit changes
        run: |
          git config user.name "todayme-bot"
          git config user.email "bot@todayme.site"
          git add .
          git commit -m "📝 Auto: New emotional content generated"
          git push
