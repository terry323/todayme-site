    * {

      display: flex;

      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .card {
      background: #ffffffee;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 2rem;
      max-width: 560px;
      width: 100%;

      margin-bottom: 1rem;
    }

      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 1.2rem;
    }
    .filter-buttons, .extra-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      background-color: #fbbd9c;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #f99c74;
    }
    .response {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      color: #4a3f35;
      min-height: 3.5rem;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #777;
    }
    @media (max-width: 480px) {
      h1 { font-size: 1.5rem; }
      .response { font-size: 1.1rem; }
    }
  </style>
</head>

  <div class="card">
    <h1>What happened today?</h1>
    <input type="text" id="userInput" placeholder="Write to yourself..." />
    <div class="filter-buttons">
      <button onclick="getResponse()">All</button>
      <button onclick="getResponse('comfort')">Comfort</button>
      <button onclick="getResponse('motivation')">Motivation</button>
      <button onclick="getResponse('healing')">Healing</button>
      <button onclick="getResponse('hope')">Hope</button>
      <button onclick="getResponse('resilience')">Resilience</button>
    </div>
    <div id="responseBox" class="response">Here’s a thought just for today.</div>
    <div class="extra-buttons">
      <button onclick="getResponse(currentEmotion)">Another Message</button>
      <button onclick="shareToTwitter()">Share</button>
    </div>
  </div>
  <div class="footer">
    &copy; 2025 TodayMe. All rights reserved.

    let currentEmotion = null;

    function getResponse(emotion) {
      currentEmotion = emotion || null;
      let filtered = responses;
      if (emotion) {
        filtered = responses.filter(r => r.emotion === emotion);
      }
      const response = filtered[Math.floor(Math.random() * filtered.length)];
      document.getElementById('responseBox').innerText = response.text;
      // Save to localStorage log
      const log = JSON.parse(localStorage.getItem("emotionLog") || "[]");
      log.push({ emotion: currentEmotion || "all", text: response.text, time: Date.now() });
      localStorage.setItem("emotionLog", JSON.stringify(log));

    }

    function shareToTwitter() {
      const text = document.getElementById("responseBox").innerText;
      const tweet = encodeURIComponent(text + " — via todayme.site");
      const url = `https://twitter.com/intent/tweet?text=${tweet}`;
      window.open(url, "_blank");
    }
